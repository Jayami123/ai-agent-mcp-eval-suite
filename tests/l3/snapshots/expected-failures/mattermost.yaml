# Conformance baseline for the Mattermost MCP at spec 2025-06-18 (P4-MCP-PROT-001). Pinned in tests/l3/all/conformance.cases.ts,
# evidence: the initialize response negotiated protocolVersion 2025-06-18 (probe, run 44692016929). Rebuilt from run 44780334406
