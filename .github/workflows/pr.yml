name: pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stub:
    name: stub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      P4_LLM_MODE: stub
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (typecheck, unit tests, stub determinism, build)
        run: npm run check

  # L1 stack jobs: real products through the harness, with the fixture stub as a container on qa-harness-p4. Stub mode only:
  # no GEMINI_API_KEY, no secrets, safe for fork PRs. They are advisory until they have been stable for a while.
  l1-librechat-stub:
    name: l1 librechat stub
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      PRODUCTS_ROOT: ${{ github.workspace }}/products
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Twenty fork, read-only, pinned to the commit the harness Twenty adapter uses (7cbdfec6, dev seeder). Never modified.
      - name: Checkout Twenty fork (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/twenty-CRM
          ref: 7cbdfec6f346b43715bc2056932f4fad5886f733
          path: products/twenty-CRM
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: LibreChat stub tool call through Twenty
        run: npm run test:stack:librechat

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-librechat-stub-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  l1-openclaw-stub:
    name: l1 openclaw stub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: OpenClaw stub tool call
        run: npm run test:stack:openclaw

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-openclaw-stub-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L4: the 62 OpenClaw cases. LiteLLM and OpenClaw (with the mock Telegram channel) are started once through the harness by
  # scripts/l4-stack.mjs; the tests only check that the stack is there. Stub mode only: no model, no GEMINI_API_KEY, no secrets, safe
  # for fork PRs. Private advisory replay files are not available in CI, so the cases that need them skip with a named reason.
  # Advisory: not a required check until the owner has seen it stable.
  l4-openclaw-stub:
    name: l4 openclaw stub
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      P4_LLM_MODE: stub
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: Start LiteLLM, OpenClaw and the mock channel
        run: npm run l4:up

      - name: L4 cases
        run: npm run test:stack:l4

      - name: Stop the L4 stack and the stub
        if: always()
        run: |
          npm run l4:down
          npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l4-openclaw-stub-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L2: the attack-lab MCP server. Runs the official conformance suite against the benign lab (spec 2025-11-25, a recorded
  # deviation from the master plan's 2026-07-28), then builds the lab image and checks that it starts. Stub mode only: no
  # model, no GEMINI_API_KEY, no secrets, safe for fork PRs. Advisory: not a required check.
  l2-attack-lab:
    name: l2 attack-lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P4_LLM_MODE: stub
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Conformance suite against the benign lab
        run: npm run test:lab:conformance

      - name: Build and start the lab container
        run: npm run lab:up

      - name: Check the container (state, resource URL, no harness in the image)
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $(cat .harness/lab/control-token)" http://127.0.0.1:9011/control/state | grep -q '"mode":"benign"'
          curl -fsS http://127.0.0.1:9010/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"http://p4-attack-lab:9010/mcp"'
          docker run --rm --entrypoint sh p4-suite-attack-lab:local -c 'test ! -e node_modules/qa-portfolio-harness && test -f dist/attack-lab/main.js'

      - name: Stop the lab container
        if: always()
        run: npm run lab:down

  # L3 stack job for Twenty: the L3 cases through LibreChat against the real Twenty MCP, stub mode only (no secrets, safe for
  # fork PRs). It also runs the S2 capture (P4_L3_CAPTURE=1), which records the real tools/list and database tables to
  # evidence/ so a human can review them and commit the snapshots. Advisory until stable (docs/branch-protection.md).
  l3-twenty:
    name: l3 twenty
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_SERVERS: twenty
      P4_L3_CAPTURE: "1"
      PRODUCTS_ROOT: ${{ github.workspace }}/products
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Twenty fork, read-only, pinned to the commit the harness Twenty adapter uses (7cbdfec6, dev seeder). Never modified.
      - name: Checkout Twenty fork (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/twenty-CRM
          ref: 7cbdfec6f346b43715bc2056932f4fad5886f733
          path: products/twenty-CRM
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: L3 twenty stack tests
        run: npm run test:stack:l3:twenty

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-twenty-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 approval wave B, Twenty: INJ-005, INJ-006, TOOL-006, TOOL-009 through LibreChat against the real Twenty MCP. Stub
  # mode only (no secrets, safe for fork PRs). The Twenty fork is read-only, pinned to the commit the harness adapter uses.
  l3-appr-wave-b-twenty:
    name: l3 appr-wave-b twenty
    runs-on: ubuntu-latest
