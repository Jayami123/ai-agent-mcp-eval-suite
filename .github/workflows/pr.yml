name: pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stub:
    name: stub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      P4_LLM_MODE: stub
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (typecheck, unit tests, stub determinism, build)
        run: npm run check

  # L1 stack jobs: real products through the harness, with the fixture stub as a container on qa-harness-p4. Stub mode only:
  # no GEMINI_API_KEY, no secrets, safe for fork PRs. They are advisory until they have been stable for a while.
  l1-librechat-stub:
    name: l1 librechat stub
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      PRODUCTS_ROOT: ${{ github.workspace }}/products
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Twenty fork, read-only, pinned to the commit the harness Twenty adapter uses (7cbdfec6, dev seeder). Never modified.
      - name: Checkout Twenty fork (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/twenty-CRM
          ref: 7cbdfec6f346b43715bc2056932f4fad5886f733
          path: products/twenty-CRM
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: LibreChat stub tool call through Twenty
        run: npm run test:stack:librechat

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-librechat-stub-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  l1-openclaw-stub:
    name: l1 openclaw stub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: OpenClaw stub tool call
        run: npm run test:stack:openclaw

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-openclaw-stub-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 stack job for Twenty: the L3 cases through LibreChat against the real Twenty MCP, stub mode only (no secrets, safe for
  # fork PRs). It also runs the S2 capture (P4_L3_CAPTURE=1), which records the real tools/list and database tables to
  # evidence/ so a human can review them and commit the snapshots. Advisory until stable (docs/branch-protection.md).
  l3-twenty:
    name: l3 twenty
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_SERVERS: twenty
      P4_L3_CAPTURE: "1"
      PRODUCTS_ROOT: ${{ github.workspace }}/products
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Twenty fork, read-only, pinned to the commit the harness Twenty adapter uses (7cbdfec6, dev seeder). Never modified.
      - name: Checkout Twenty fork (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/twenty-CRM
          ref: 7cbdfec6f346b43715bc2056932f4fad5886f733
          path: products/twenty-CRM
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: L3 twenty stack tests
        run: npm run test:stack:l3:twenty

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-twenty-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
