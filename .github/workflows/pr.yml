        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-penpot-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 lab-only cases: the attack-lab as a container on qa-harness-p4 (the same bring-up as the L2 job), then the host cases
  # that read its published loopback ports. No model, no secrets, stub mode only. Advisory until stable (docs/branch-protection.md).
  l3-lab:
    name: l3 lab
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      # Standard lab configuration: the host cases, the approval gates, the standard-lab gate cases and the approval matrix.
      - name: Build and start the attack-lab container (standard)
        run: npm run lab:up

      - name: L3 lab host cases (PROT-005, PROT-006, META-009, SUPP-002)
        run: npm run test:stack:l3:host

      - name: L3 lab gate cases through LibreChat (REL-001, REL-005, META-001, SUPP-003)
        run: npm run test:stack:l3:lab-gates

      - name: L3 lab standard gate cases (META-010, META-005, META-007, SUPP-007, REL-009)
        run: npm run test:stack:l3:lab-std

      - name: L3 lab approval matrix (APPR-007)
        run: npm run test:stack:l3:lab-matrix

      - name: Stop the attack-lab container (standard)
        if: always()
        run: npm run lab:down

      # Schema poison surface: the lab is started with LAB_POISON_SURFACE=schema (META-006).
      - name: Build and start the attack-lab container (schema poison surface)
        env:
          LAB_POISON_SURFACE: schema
        run: npm run lab:up

      - name: L3 lab schema-surface case (META-006)
        run: npm run test:stack:l3:lab-schema

      - name: Stop the attack-lab container (schema)
        if: always()
        run: npm run lab:down

      # Typo-squat server name: the lab is started with a one-character typo of its pinned name (SUPP-004).
      - name: Build and start the attack-lab container (typo name)
        env:
          LAB_SERVER_NAME: p4-attack-lad
        run: npm run lab:up

      - name: L3 lab typo-squat case (SUPP-004)
        run: npm run test:stack:l3:lab-typo

      - name: Stop the attack-lab container (typo name)
        if: always()
        run: npm run lab:down

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

  # L3 always-allow and pinning cases (META-002, META-004, META-008, META-011) on harness v0.6.7. Always allow is on in this job
  # only, and no ask rule is set (LibreChat never offers Always allow for an ask-matched tool). Two attack-lab containers: lab and
  # lab2 (the second server). Stub mode only: no GEMINI_API_KEY, no secrets, safe for fork PRs. Advisory until stable.
  l3-always-allow:
    name: l3 always-allow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: Build and start the attack-lab containers (lab and lab2)
        run: npm run lab:up

      - name: Check both labs answer on their MCP ports (lab 9010, lab2 9013)
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:9010/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"http://p4-attack-lab:9010/mcp"'
          curl -fsS http://127.0.0.1:9013/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"http://p4-attack-lab-2:9011/mcp"'

      - name: L3 always-allow and pinning cases (META-002, META-004, META-008, META-011)
        run: npm run test:stack:l3:always-allow

      # Every verdict and note, per case (names and statuses only; the leak check fails the run before this if a secret is in it).
      - name: Print the case verdicts
        if: always()
        run: |
          for f in evidence/traces/*/verdicts.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Stop the attack-lab containers
        if: always()
        run: npm run lab:down

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-always-allow-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 always-allow cases with the Nextcloud mail stack (P4-MCP-APPR-002, P4-MCP-META-013). Nextcloud and its Mail app run through the
  # harness with GreenMail (P4_MAIL=1), and the attack-lab (lab) runs as a container. Always allow is on in this job only, with NO ask
  # rule (LibreChat never offers Always allow for an ask-matched tool). Stub mode only: no GEMINI_API_KEY, no secrets, safe for fork PRs.
  l3-always-allow-mail:
    name: l3 always-allow mail
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_SERVERS: nextcloud,lab
      P4_L3_PROBE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      # The lab starts benign: META-013 switches it to shadow-name itself (/control/mode) and its setup checks the tool hash
      # changes, and the cleanup sweep expects a benign start. Starting in shadow-name breaks both.
      - name: Build and start the attack-lab containers (lab and lab2)
        run: npm run lab:up

      - name: Check the lab answers on its MCP port (lab 9010)
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:9010/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"http://p4-attack-lab:9010/mcp"'

      # Aligned with the l3 mail job: its Nextcloud stack boots once for the probe, then again for the cases. The probe runs first
      # here too, so both jobs boot the Mail stack the same number of times on the same kept volumes.
      - name: L3 wave D mail probe (aligns the boot sequence with l3 mail)
        run: npm run test:stack:l3:probe:mail

      - name: L3 always-allow mail cases (APPR-002, META-013)
        run: npm run test:stack:l3:always-allow-mail

      # Every verdict and note, per case (names and statuses only; the leak check fails the run before this if a secret is in it).
      - name: Print the case verdicts
        if: always()
        run: |
          for f in evidence/traces/*/verdicts.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      # Nextcloud's log and the Mail/SMTP lines, captured by the test before the Nextcloud containers stop (see tests/l3/support/nc-log.ts).
      - name: Print the Nextcloud log excerpt (redacted at capture)
        if: always()
        run: |
          for f in evidence/l3/always-allow-mail-*/sends.json evidence/l3/always-allow-mail-*/nextcloud-log-tail.txt evidence/l3/always-allow-mail-*/nextcloud-log-mail-smtp.txt evidence/l3/always-allow-mail-*/nextcloud-mcp-logs-tail.txt evidence/l3/always-allow-mail-*/greenmail-logs-tail.txt evidence/l3/always-allow-mail-*/nextcloud-app-docker-logs.txt evidence/l3/always-allow-mail-*/mail-account-settings.json evidence/l3/always-allow-mail-*/nextcloud-to-greenmail.txt evidence/l3/always-allow-mail-*/smtp-auth-probe.txt evidence/l3/always-allow-mail-*/nextcloud-other-logs.txt; do
            [ -f "$f" ] || { echo "missing: $f"; continue; }
            echo "== $f ($(wc -l < "$f") lines)"
            # Error-bearing lines first (the 500, SMTP, recipient and mail lines), then the last 60 lines.
            grep -i -E 'could not|500|error|exception|smtp|rcpt|recipient|reject|denied|quota|size|mail' "$f" | tail -n 60 || true
            echo "-- last 60 lines:"
            tail -n 60 "$f"
          done

      - name: Stop the attack-lab containers
        if: always()
        run: npm run lab:down

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-always-allow-mail-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 Outline cases (OAUTH-012, OAUTH-013, INJ-004, INJ-011, INJ-017) on one Outline stack through the harness, with the second
  # identity (H2) and the approval knob (H3). Stub mode only: no GEMINI_API_KEY, no secrets, safe for fork PRs. Target about 20
  # minutes. Advisory until stable (docs/branch-protection.md). The live probe (P4_L3_OUTLINE_PROBE) runs first and only records.
  l3-outline:
    name: l3 outline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_SERVERS: outline
      P4_SECOND_IDENTITY: "1"
      P4_L3_OUTLINE_PROBE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: L3 outline stack (live probe, then cases)
        run: npm run test:stack:l3:outline

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-outline-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 wave D, mail cases: Nextcloud with the Mail app and GreenMail (P4_MAIL=1, set by the test entry and by nothing else), the
  # attack-lab in shadow-name mode, LibreChat with every tool behind an approval. Stub mode only: no model, no secrets, safe for
  # fork PRs. Own job so the Mail app install and GreenMail never touch the other Nextcloud job. Advisory until stable.
  l3-mail:
    name: l3 mail
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_PROBE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: Build and start the attack-lab container (shadow-name)
        env:
          LAB_MODE: shadow-name
        run: npm run lab:up

      - name: L3 wave D mail probe
        run: npm run test:stack:l3:probe:mail

      - name: L3 wave D mail cases (APPR-003, META-003)
        run: npm run test:stack:l3:mail

      - name: Stop the attack-lab container
        if: always()
        run: npm run lab:down

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-mail-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 wave D, UI cases: LibreChat's own UI driven by Playwright (Chromium), against the attack-lab in URL-elicitation mode with
  # a look-alike display title. Stub mode only. Advisory until stable.
  l3-ui:
    name: l3 ui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_PROBE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: Build and start the attack-lab container (url elicitation, look-alike title)
        env:
          LAB_MODE: elicitation-url
          LAB_SERVER_TITLE: Nextcloud (official)
        run: npm run lab:up

      - name: L3 wave D UI probe
        run: npm run test:stack:l3:probe:ui

      - name: L3 wave D UI cases (APPR-004, APPR-005, META-012)
        run: npm run test:stack:l3:ui

      - name: Stop the attack-lab container
        if: always()
        run: npm run lab:down

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-ui-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  # L3 Mattermost cases on harness v0.6.8: the real Mattermost MCP, the second identity (H2, qa-agent-b) and its seeded posts
  # (H7). Stub model only (no GEMINI_API_KEY, no secrets, safe for fork PRs). The job runs the live capture first (P4_L3_CAPTURE=1),
  # then the assertions. Advisory until stable (docs/branch-protection.md).
  l3-mattermost:
    name: l3 mattermost
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      P4_LLM_MODE: stub
      P4_STACK_TESTS: "1"
      P4_L3_SERVERS: mattermost
      P4_SECOND_IDENTITY: "1"
      P4_SECOND_POSTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start the stub container on qa-harness-p4
        run: npm run stub:up

      - name: L3 mattermost stack tests (protocol, injection, tool and hygiene cases)
        run: npm run test:stack:l3:mattermost

      - name: Stop the stub container
        if: always()
        run: npm run stub:down

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-mattermost-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
